{% extends 'web/base_public.html' %}
{% block content %}
<div class="page-wrap" style="max-width:420px">
  <div class="card">
    <h1 style="font-family:'Frank Ruhl Libre',serif;color:var(--cream);margin-bottom:8px;text-align:center">כניסה</h1>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:16px">התחבר לחשבון Mandeles</p>
    <form id="login-form" style="display:flex;flex-direction:column;gap:10px">
      <label style="font-size:.8rem;color:var(--muted)">שם משתמש או אימייל</label>
      <input type="text" id="login-email" required autocomplete="username" style="background:var(--navy);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--text);font-family:Heebo,sans-serif">
      <label style="font-size:.8rem;color:var(--muted)">סיסמה</label>
      <input type="password" id="login-pw" required autocomplete="current-password" style="background:var(--navy);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--text);font-family:Heebo,sans-serif">
      <button type="submit" class="btn btn-primary btn-block">כניסה</button>
    </form>
    <p id="login-msg" style="margin-top:12px;font-size:.82rem;text-align:center;display:none"></p>
    <p style="margin-top:14px;text-align:center;font-size:.8rem;color:var(--muted)">אין חשבון? <a href="/register/" style="color:var(--gold)">הרשמה</a></p>
    <p style="margin-top:8px;text-align:center"><a href="/" style="color:var(--muted);font-size:.78rem">← חזרה לאתר</a></p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function logoutUser() {
  try { await fetch('/api/auth/logout/', { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRFToken': await getCsrf() } }); } catch (e) {}
  localStorage.removeItem('auth_token');
  localStorage.removeItem('fb_token');
  localStorage.removeItem('demo_mode');
  window.location.href = '/';
}
async function getCsrf() {
  const r = await fetch('/api/auth/csrf/', { credentials: 'same-origin' });
  const d = await r.json();
  return d.csrfToken;
}
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.style.display = 'block';
  msg.style.color = 'var(--muted)';
  msg.textContent = 'מתחבר...';
  try {
    const csrf = await getCsrf();
    const res = await fetch('/api/auth/login/', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify({
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-pw').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.style.color = 'var(--loss)';
      msg.textContent = data.error || 'שגיאת התחברות';
      return;
    }
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    window.location.href = redirect;
  } catch (err) {
    msg.style.color = 'var(--loss)';
    msg.textContent = 'שגיאת רשת';
  }
});
</script>
{% endblock %}
