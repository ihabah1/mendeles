{% extends 'web/base_public.html' %}
{% block content %}
<div class="page-wrap" style="max-width:480px">
  <div class="card">
    <h1 style="font-family:'Frank Ruhl Libre',serif;color:var(--cream);margin-bottom:4px;text-align:center">החשבון שלי</h1>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px">עדכון פרטים אישיים</p>
    <form id="account-form" style="display:flex;flex-direction:column;gap:10px">
      <label style="font-size:.8rem;color:var(--muted)">שם פרטי</label>
      <input type="text" id="acc-first-name" required minlength="2" maxlength="60" autocomplete="given-name"
        value="{{ user.first_name|default:user.full_name }}"
        style="background:var(--navy);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--text);font-family:Heebo,sans-serif">
      <label style="font-size:.8rem;color:var(--muted)">שם מלא (אופציונלי)</label>
      <input type="text" id="acc-full-name" maxlength="120" autocomplete="name"
        value="{{ user.full_name }}"
        style="background:var(--navy);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--text);font-family:Heebo,sans-serif">
      <label style="font-size:.8rem;color:var(--muted)">טלפון</label>
      <input type="tel" id="acc-phone" maxlength="20" autocomplete="tel"
        value="{{ user.phone }}"
        style="background:var(--navy);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--text);font-family:Heebo,sans-serif">
      <label style="font-size:.8rem;color:var(--muted)">אימייל (לא ניתן לשינוי)</label>
      <input type="email" id="acc-email" disabled value="{{ user.email }}"
        style="background:var(--navy-c);border:1.5px solid var(--navy-b);border-radius:8px;padding:10px;color:var(--muted);font-family:Heebo,sans-serif">
      <button type="submit" class="btn btn-primary btn-block">שמור שינויים</button>
    </form>
    <p id="acc-msg" style="margin-top:12px;font-size:.82rem;text-align:center;display:none"></p>
    <p style="margin-top:16px;text-align:center;font-size:.8rem">
      <a href="/classic/profile.html" style="color:var(--gold)">ארנק ומנוי (ממשק מורחב)</a>
      · <a href="/" style="color:var(--muted)">חזרה לאתר</a>
    </p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function getCsrf() {
  const r = await fetch('/api/auth/csrf/', { credentials: 'same-origin' });
  return (await r.json()).csrfToken;
}
document.getElementById('account-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('acc-msg');
  msg.style.display = 'block';
  msg.style.color = 'var(--muted)';
  msg.textContent = 'שומר...';
  try {
    const csrf = await getCsrf();
    const res = await fetch('/api/auth/profile/', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify({
        first_name: document.getElementById('acc-first-name').value.trim(),
        full_name: document.getElementById('acc-full-name').value.trim(),
        phone: document.getElementById('acc-phone').value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.style.color = 'var(--loss)';
      msg.textContent = data.error || 'שגיאה';
      return;
    }
    msg.style.color = 'var(--win)';
    msg.textContent = 'נשמר בהצלחה';
    const name = data.user.display_name || data.user.first_name;
    const nav = document.getElementById('nav-user-name');
    if (nav) nav.textContent = name;
    document.body.dataset.userName = name;
  } catch (err) {
    msg.style.color = 'var(--loss)';
    msg.textContent = 'שגיאת רשת';
  }
});
</script>
{% endblock %}
